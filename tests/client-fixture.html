<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>远程工作区</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/native-page.css">
<link rel="stylesheet" href="/native-button.css">
<link rel="stylesheet" href="/native-input.css">
<style>#app{height:100vh}#native-reference{visibility:hidden;position:fixed;left:-10000px;top:0}</style>
<div id="native-reference" aria-hidden="true"><h1 class="pageTitle">插件</h1><p class="pageIntro">管理已安装的插件</p><button class="button md primary">安装</button><div class="wrap"><input class="input"></div></div>
<div id="app"></div>
<script src="/react.js"></script><script src="/react-dom.js"></script>
<script>
window.dshDesktop = {};
window.__ModuleLoader__ = { load(module) { window.clientModule = module } };
</script>
<script src="/plugin.js"></script>
<script>
(async () => {
  const ui = { aliases: ['harness-lan'], targets: [], state: { phase: 'idle', generation: 0 }, calls: 0,
    opens: 0, session: false, sessionId: 'session-a', failure: '', failAliases: false, delay: 0, missingRoutes: false,
    panel: 'remote-workspace', tickets: 0, ticketDelay: 0, browserFailure: '', openedSession: '', openedUrl: '' };
  window.fixture = ui;
  const ok = value => ({ ok: true, value });
  const slots = new Map(); let dictionary;
  const service = {
    async listTargets() { return ok(ui.targets) }, async getState() { return ok(ui.state) },
    async listAliases() {
      if (ui.missingRoutes) throw new Error('client api: remoteWorkspace/listAliases failed: transport failure for /api/remoteWorkspace/listAliases: HTTP 404');
      return ui.failAliases ? { ok: false, error: new Error('unreadable') } : ok(ui.aliases);
    },
    async saveTarget(target) { ui.targets = [target]; return ok(ui.targets) },
    async quickConnect(alias, key) {
      ui.calls++;
      if (ui.missingRoutes) throw new Error('client api: remoteWorkspace/quickConnect failed: transport failure for /api/remoteWorkspace/quickConnect: HTTP 404');
      if (ui.delay) await new Promise(resolve => setTimeout(resolve, ui.delay));
      if (ui.failure) return { ok: false, error: new Error(ui.failure) };
      const target = { id: 'auto-id', name: alias, instanceKey: key, instanceId: 'instance-a', profile: 'web',
        workspaceHint: '/srv/project', remotePort: 4321, endpoints: [{ id: 'ssh', kind: 'lan', sshAlias: alias }] };
      ui.targets = [target];
      ui.state = { phase: 'app-ready', generation: 1, connectionId: 'connection-a', targetId: target.id,
        endpointId: 'ssh', hostName: alias, instanceId: target.instanceId, profile: target.profile, workspaceHint: target.workspaceHint };
      return ok(ui.state);
    },
    async connect() { return ok({ ...ui.state, phase: 'app-ready', connectionId: 'connection-a' }) },
    async disconnect() { ui.state = { phase: 'idle', generation: 2 }; return ok(ui.state) },
    async createOpenTicket() { ui.tickets++; if (ui.ticketDelay) await new Promise(resolve => setTimeout(resolve, ui.ticketDelay)); return ok('http://127.0.0.1/example-ticket') },
  };
  const ctx = {
    remote: { remoteWorkspace: service, async $mount() { return async () => {} },
      $stream() { return { async *[Symbol.asyncIterator]() {}, dispose() {} } } },
    inject(_names, callback) { callback(ctx) }, effect(callback) { callback() },
    locale: { register(_namespace, dictionaries) { dictionary = dictionaries.zh }, bind() { return key => dictionary[key] } },
    slots: { inject(_name, callback) { callback() }, register(props, Component) { slots.set(props.name, { props, Component }) } },
    uiSession: { adapter: { current: { getSnapshot() { return { key: ui.session ? ui.sessionId : undefined } } } } },
    sidebarRight: { mounted: { getSnapshot() { return ui.session && ui.panel === null ? ui.sessionId : undefined } },
      openTab(kind, options) {
        if (!ui.session || ui.panel !== null) throw new Error('sidebarRight: no session surface is mounted');
        if (ui.browserFailure) throw new Error(ui.browserFailure);
        if (kind !== 'browser' || !options?.params?.url) throw new Error('Invalid Browser intent');
        ui.opens++; ui.openedSession = ui.sessionId; ui.openedUrl = options.params.url;
      } },
    layout: { panelInfo: { getSnapshot() { return { activePanelId: ui.panel } } }, selectPanel(panel) { ui.panel = panel } },
  };
  const jsx = (type, props, key) => React.createElement(type, key === undefined ? props : { ...props, key });
  const client = window.clientModule.factory(name => name === 'react' ? React : name === 'react/jsx-runtime' ? { jsx, jsxs: jsx, Fragment: React.Fragment } : (() => { throw Error(name) })());
  await client.apply(ctx);
  const { props, Component } = slots.get('main');
  const face = props.inject();
  ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(Component, { ...face, t: key => dictionary[key] }));
})();
</script></html>
